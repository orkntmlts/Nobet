<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NöbetTakip">
  <meta name="format-detection" content="telephone=no">
  <title>NöbetTakip</title>
  <style>
    :root {
      --indigo:#4338ca; --bg:#f8fafc; --text:#0f172a;
      --muted:#64748b; --line:#e2e8f0; --green:#059669; --greenbg:#ecfdf5;
      --red:#e11d48; --redbg:#fff1f2;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{padding-bottom:max(24px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}
    button{cursor:pointer}
    
    .header{background:var(--indigo);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 22px;
      border-radius:0 0 28px 28px;box-shadow:0 10px 25px rgba(67,56,202,.18)}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:center}
    .brand{font-size:24px;font-weight:800;margin:0}
    .clock{text-align:right}.clock strong{display:block;font-size:19px}.clock span{font-size:12px;opacity:.85}
    
    .days{display:flex;gap:8px;overflow:auto;margin-top:18px;padding-bottom:2px}
    .day{border:0;border-radius:12px;padding:9px 13px;background:#3730a3;color:#c7d2fe;font-weight:700;white-space:nowrap}
    .day.active{background:#fff;color:var(--indigo);box-shadow:0 3px 10px rgba(0,0,0,.12)}
    
    .wrap{max-width:520px;margin:0 auto;padding:18px 14px}
    .panel, .empty{background:#fff;border:1px solid #edf2f7;border-radius:20px;box-shadow:0 2px 12px rgba(15,23,42,.04)}
    .panel{padding:16px;margin-bottom:16px}
    .panel h2{font-size:14px;margin:0}
    .hint{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}
    .file{width:100%;margin-top:12px;color:var(--muted)}
    
    .clear-btn{border:0;border-radius:10px;background:#ffe4e6;color:#be123c;padding:10px 14px;font-size:13px;font-weight:800; width: 100%; margin-top: 20px;}
    
    .loc-group {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15,23,42,.03);
    }
    .loc-summary {
      padding: 16px;
      font-weight: 700;
      font-size: 15px;
      color: var(--indigo);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      transition: background 0.2s;
    }
    .loc-summary::-webkit-details-marker { display: none; }
    .loc-summary:active { background: #f1f5f9; }
    .loc-group[open] .loc-summary { border-bottom: 1px solid var(--line); background: #fff; }
    .loc-title { display: flex; align-items: center; gap: 6px; }
    .loc-content { padding: 16px 14px 4px 14px; background: #fff; }

    .card{padding:15px;margin-bottom:12px;border:2px solid #f1f5f9;border-radius: 16px; transition:.15s; box-shadow: none;}
    .card.present{border-color:#a7f3d0;background:var(--greenbg)}
    .card.absent{border-color:#fecdd3;background:var(--redbg)}
    .cardhead{display:flex;align-items:flex-start;gap:12px}
    .avatar{width:44px;height:44px;border-radius:14px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
    .meta{min-width:0;flex:1}
    .name{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .email{font-size:11px;color:#94a3b8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .btn{border:1px solid var(--line);border-radius:13px;background:#f8fafc;padding:12px 10px;font-weight:800;color:#475569}
    .btn.present.active{background:var(--green);border-color:var(--green);color:#fff}
    .btn.absent.active{background:var(--red);border-color:var(--red);color:#fff}
    .mailagain{display:block;margin-top:10px;text-align:center;border-radius:13px;background:var(--red);color:white;text-decoration:none;padding:11px;font-weight:800;font-size:13px}
    
    .empty{padding:28px 18px;text-align:center;color:var(--muted)}
    .empty b{display:block;color:#475569;margin-bottom:5px}
  </style>
</head>
<body>
<header class="header">
  <div class="top">
    <h1 class="brand">🛡️ NöbetTakip</h1>
    <div class="clock">
      <strong id="currentTime">00:00</strong>
      <span id="currentDate">Tarih</span>
    </div>
  </div>
  <div class="days" id="dayTabs"></div>
</header>

<main class="wrap">
  <!-- Yükleme Paneli (Sadece veri yoksa görünür) -->
  <section class="panel" id="uploadPanel">
    <h2>📄 Nöbet Excel'ini Yükle</h2>
    <p class="hint">.xlsx veya .xlsm dosyanızı seçin. “NÖBET” ve “TENEFFÜS” sayfaları otomatik okunur.</p>
    <input class="file" type="file" id="excel-upload" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12">
  </section>

  <div id="app-content"></div>
</main>

<script>
/* ---------------------- Ayarlar ---------------------- */
const ccEmails = "evrim.temizel@cakabey.k12.tr,engin.teker@cakabey.k12.tr,nermin.teker@cakabey.k12.tr,derya.koyuncu@cakabey.k12.tr,orkun.temeltas@cakabey.k12.tr";
const emailDomain = "cakabey.k12.tr";
const days = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma"];

let weeklySchedule = readJSON("nobet_weekly_schedule") || {Pazartesi:[],Salı:[],Çarşamba:[],Perşembe:[],Cuma:[]};
let breakTimes = readJSON("nobet_breaks") || [];
const sessionStatus = new Map(); // KALICI DEĞİL

const dow = new Date().getDay();
let activeDay = (dow >= 1 && dow <= 5) ? days[dow - 1] : "Pazartesi";

function readJSON(key){
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function saveSchedule(){
  localStorage.setItem("nobet_weekly_schedule", JSON.stringify(weeklySchedule));
  localStorage.setItem("nobet_breaks", JSON.stringify(breakTimes));
}

/* ---------------------- Zaman ---------------------- */
function updateTime(){
  const now = new Date();
  document.getElementById("currentTime").textContent = now.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("currentDate").textContent = now.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
}
setInterval(updateTime, 1000);
updateTime();

function getCurrentBreakName(){
  if (!breakTimes.length) return "ilgili nöbet";
  const now = new Date();
  const t = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  for (const b of breakTimes){
    if (t >= b.start && t <= b.end) return b.name;
  }
  return "ilgili nöbet";
}

/* ---------------------- Gün sekmeleri ---------------------- */
function renderDayTabs(){
  const box = document.getElementById("dayTabs");
  box.innerHTML = "";
  days.forEach(day => {
    const b = document.createElement("button");
    b.className = "day" + (day === activeDay ? " active" : "");
    b.textContent = day;
    b.onclick = () => { activeDay = day; renderDayTabs(); renderTeachers(); };
    box.appendChild(b);
  });
}

/* ---------------------- Email ---------------------- */
const charMap = {'İ':'i','I':'i','ı':'i','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ş':'s','Ş':'s','ö':'o','Ö':'o','ç':'c','Ç':'c'};
function formatEmailPrefix(text){
  return String(text).replace(/[İIığĞüÜşŞöÖçÇ]/g,ch=>charMap[ch]||ch)
    .toLowerCase().trim().replace(/\s+/g,".").replace(/[^a-z0-9.]/g,"");
}
function generateMailtoLink(teacher){
  const dateStr = new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  const toEmail = `${teacher.emailPrefix}@${emailDomain}`;
  const subject = encodeURIComponent("Nöbet Görevi Hakkında");
  const currentBreak = getCurrentBreakName();
  const bodyText =
`Sayın ${teacher.name.toUpperCase()},

Bugün (${dateStr}), ${currentBreak} saatinde "${teacher.location}" alanındaki nöbet yerinizde bulunmadığınız tespit edilmiştir.

Öğrenci güvenliğinin sağlanması adına; nöbet alanına zamanında intikal etmenizi ve görev süresince öğrencileri aktif olarak takip etmenizi önemle rica ederim.

İlkokul Müdürlüğü`;
  const body = encodeURIComponent(bodyText).replace(/%0A/g,"%0D%0A");
  return `mailto:${toEmail}?cc=${ccEmails}&subject=${subject}&body=${body}`;
}
function markPresent(id, locKey){
  sessionStatus.set(id,"present");
  renderTeachers(locKey);
}
function markAbsentAndMail(id, locKey){
  const teacher = (weeklySchedule[activeDay]||[]).find(t=>t.id===id);
  if(!teacher) return;
  sessionStatus.set(id,"absent");
  renderTeachers(locKey);
  window.location.href = generateMailtoLink(teacher);
}
function getStatus(id){ return sessionStatus.get(id) || "pending"; }

/* ---------------------- Minimal XLSX okuyucu ---------------------- */
async function unzipEntries(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  let eocd = -1;
  for(let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--){
    if(view.getUint32(i,true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Geçerli bir Excel ZIP yapısı bulunamadı.");
  const total = view.getUint16(eocd + 10, true);
  let off = view.getUint32(eocd + 16, true);
  const td = new TextDecoder("utf-8");
  const out = new Map();

  for(let n=0;n<total;n++){
    if(view.getUint32(off,true)!==0x02014b50) throw new Error("Excel ZIP dizini okunamadı.");
    const method = view.getUint16(off+10,true);
    const compSize = view.getUint32(off+20,true);
    const nameLen = view.getUint16(off+28,true);
    const extraLen = view.getUint16(off+30,true);
    const commentLen = view.getUint16(off+32,true);
    const localOffset = view.getUint32(off+42,true);
    const name = td.decode(bytes.slice(off+46, off+46+nameLen));

    if(view.getUint32(localOffset,true)!==0x04034b50) throw new Error("Excel ZIP girdisi bozuk.");
    const lName = view.getUint16(localOffset+26,true);
    const lExtra = view.getUint16(localOffset+28,true);
    const start = localOffset + 30 + lName + lExtra;
    const compressed = bytes.slice(start, start + compSize);

    let data;
    if(method === 0){
      data = compressed;
    }else if(method === 8){
      if(typeof DecompressionStream === "undefined"){
        throw new Error("Bu iPhone/Safari sürümü yerel Excel açmayı desteklemiyor.");
      }
      const ds = new DecompressionStream("deflate-raw");
      data = new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(ds)).arrayBuffer());
    }else{
      throw new Error("Excel içinde desteklenmeyen sıkıştırma yöntemi bulundu.");
    }
    out.set(name, data);
    off += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}
function xmlText(entries,path){
  const b = entries.get(path);
  if(!b) return "";
  return new TextDecoder("utf-8").decode(b);
}
function parseXml(text){
  const doc = new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("Excel XML içeriği okunamadı.");
  return doc;
}
function colToIndex(ref){
  const m = String(ref).match(/[A-Z]+/i);
  if(!m) return 0;
  let n=0;
  for(const ch of m[0].toUpperCase()) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
function normalizeTarget(base,target){
  if(target.startsWith("/")) return target.slice(1);
  const parts = (base + "/" + target).split("/");
  const stack=[];
  for(const p of parts){
    if(!p || p===".") continue;
    if(p==="..") stack.pop(); else stack.push(p);
  }
  return stack.join("/");
}
function getCellValue(cell, sharedStrings){
  const type = cell.getAttribute("t");
  if(type === "inlineStr"){
    return Array.from(cell.getElementsByTagName("t")).map(x=>x.textContent||"").join("");
  }
  const v = cell.getElementsByTagName("v")[0];
  if(!v) return "";
  const raw = v.textContent || "";
  if(type === "s") return sharedStrings[Number(raw)] ?? "";
  if(type === "b") return raw === "1";
  return raw;
}
function parseSheetRows(xml, sharedStrings){
  const doc = parseXml(xml);
  const rows = [];
  const rowNodes = Array.from(doc.getElementsByTagName("row"));
  for(const row of rowNodes){
    const arr=[];
    for(const c of Array.from(row.getElementsByTagName("c"))){
      const idx = colToIndex(c.getAttribute("r")||"A1");
      arr[idx] = getCellValue(c, sharedStrings);
    }
    rows.push(arr);
  }
  return rows;
}
async function readWorkbook(file){
  const entries = await unzipEntries(await file.arrayBuffer());
  let sharedStrings=[];
  const ss = xmlText(entries,"xl/sharedStrings.xml");
  if(ss){
    const doc=parseXml(ss);
    sharedStrings = Array.from(doc.getElementsByTagName("si")).map(si =>
      Array.from(si.getElementsByTagName("t")).map(t=>t.textContent||"").join("")
    );
  }
  const wb = parseXml(xmlText(entries,"xl/workbook.xml"));
  const rels = parseXml(xmlText(entries,"xl/_rels/workbook.xml.rels"));
  const relMap = {};
  Array.from(rels.getElementsByTagName("Relationship")).forEach(r=>{
    relMap[r.getAttribute("Id")] = r.getAttribute("Target");
  });
  const result=[];
  Array.from(wb.getElementsByTagName("sheet")).forEach(s=>{
    const name=s.getAttribute("name")||"";
    const rid=s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const target=relMap[rid];
    if(!target) return;
    const path=normalizeTarget("xl",target);
    const xml=xmlText(entries,path);
    if(xml) result.push({name, rows:parseSheetRows(xml,sharedStrings)});
  });
  return result;
}

/* ---------------------- Excel işleme ---------------------- */
document.getElementById("excel-upload").addEventListener("change", async function(e){
  const file=e.target.files[0];
  if(!file) return;
  try{
    const ext=file.name.toLowerCase();
    if(!(ext.endsWith(".xlsx")||ext.endsWith(".xlsm"))){
      alert("Bu bağımsız iPhone sürümü .xlsx ve .xlsm dosyalarını destekler.");
      return;
    }
    const sheets=await readWorkbook(file);
    if(!sheets.length) throw new Error("Excel sayfaları okunamadı.");

    const nobet = sheets.find(s=>s.name.trim().toUpperCase().includes("NÖBET")) || sheets[0];
    const nobetData=nobet.rows;
    let headerRowIndex=-1;
    for(let i=0;i<Math.min(10,nobetData.length);i++){
      const row=nobetData[i]||[];
      if(row.includes("Nöbet Yeri") && row.includes("Pazartesi")){ headerRowIndex=i; break; }
    }
    if(headerRowIndex<0) throw new Error("Uygun formatta 'Nöbet Yeri' ve 'Pazartesi' başlıkları bulunamadı.");

    const headers=nobetData[headerRowIndex];
    const locIdx=headers.indexOf("Nöbet Yeri");
    const dayIdx={};
    days.forEach(d=>dayIdx[d]=headers.indexOf(d));

    weeklySchedule={Pazartesi:[],Salı:[],Çarşamba:[],Perşembe:[],Cuma:[]};
    sessionStatus.clear();

    for(let i=headerRowIndex+1;i<nobetData.length;i++){
      const row=nobetData[i]||[];
      if(!row[locIdx]) continue;
      const location=String(row[locIdx]).trim();
      days.forEach(day=>{
        const ci=dayIdx[day];
        const value=ci>=0 ? row[ci] : "";
        const teacherName=value==null ? "" : String(value).trim();
        if(teacherName && teacherName !== "-"){
          weeklySchedule[day].push({
            id:`${day}_${i}`,
            name:teacherName,
            emailPrefix:formatEmailPrefix(teacherName),
            location
          });
        }
      });
    }

    breakTimes=[];
    const teneffus=sheets.find(s=>s.name.trim().toUpperCase().includes("TENEFFÜS"));
    if(teneffus){
      for(const row of teneffus.rows){
        if(row[0] && row[1]){
          const range=String(row[1]).split("-");
          if(range.length===2){
            breakTimes.push({
              name:String(row[0]).trim(),
              start:range[0].trim().replace(".",":"),
              end:range[1].trim().replace(".",":")
            });
          }
        }
      }
    }

    saveSchedule();
    renderTeachers();
  }catch(err){
    console.error(err);
    alert(err && err.message ? err.message : "Excel okunurken hata oluştu.");
  }finally{
    e.target.value="";
  }
});

function clearSchedule(){
  if(!confirm("Çizelgeyi sıfırlamak istediğinize emin misiniz?")) return;
  weeklySchedule={Pazartesi:[],Salı:[],Çarşamba:[],Perşembe:[],Cuma:[]};
  breakTimes=[];
  sessionStatus.clear();
  localStorage.removeItem("nobet_weekly_schedule");
  localStorage.removeItem("nobet_breaks");
  renderTeachers();
}

/* ---------------------- Arayüz (Akordeon Gruplama) ---------------------- */
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderTeachers(openLoc = null){
  const box = document.getElementById("app-content");
  const uploadPanel = document.getElementById("uploadPanel");
  
  const list = weeklySchedule[activeDay]||[];
  const empty = Object.values(weeklySchedule).every(x=>x.length===0);
  
  // Eğer liste boşsa yükleme panelini göster, doluysa gizle
  if(empty){
    uploadPanel.style.display = "block";
    box.innerHTML='<div class="empty"><b>Henüz nöbet çizelgesi yok.</b>Yukarıdan Excel dosyanızı seçin.</div>';
    return;
  } else {
    uploadPanel.style.display = "none";
  }
  
  if(!list.length){
    box.innerHTML=`<div class="empty"><b>${escapeHtml(activeDay)} için nöbetçi bulunmuyor.</b></div>
                   <button class="clear-btn" onclick="clearSchedule()">Çizelgeyi Sıfırla</button>`;
    return;
  }

  const groupedByLocation = {};
  list.forEach(t => {
    if(!groupedByLocation[t.location]) groupedByLocation[t.location] = [];
    groupedByLocation[t.location].push(t);
  });

  let html = "";
  for(const [location, teachers] of Object.entries(groupedByLocation)) {
    const isOpen = openLoc === location ? "open" : "";
    
    html += `
      <details class="loc-group" ${isOpen}>
        <summary class="loc-summary">
          <div class="loc-title">📍 ${escapeHtml(location)}</div>
        </summary>
        <div class="loc-content">
    `;

    teachers.forEach(t => {
      const st = getStatus(t.id);
      const mail = generateMailtoLink(t);
      html += `
        <article class="card ${st}">
          <div class="cardhead">
            <div class="avatar">👤</div>
            <div class="meta">
              <div class="name">${escapeHtml(t.name)}</div>
              <div class="email">${escapeHtml(t.emailPrefix)}@${emailDomain}</div>
            </div>
          </div>
          <div class="actions">
            <button class="btn present ${st==="present"?"active":""}" onclick='markPresent(${JSON.stringify(t.id)}, ${JSON.stringify(t.location)})'>✓ Geldi</button>
            <button class="btn absent ${st==="absent"?"active":""}" onclick='markAbsentAndMail(${JSON.stringify(t.id)}, ${JSON.stringify(t.location)})'>✕ Gelmedi</button>
          </div>
          ${st==="absent" ? `<a class="mailagain" href="${mail}">✉️ Maili tekrar aç</a>` : ""}
        </article>`;
    });

    html += `</div></details>`;
  }
  
  // Sıfırlama Butonunu En Alta Ekliyoruz
  html += `<button class="clear-btn" onclick="clearSchedule()">Çizelgeyi Sıfırla</button>`;
  
  box.innerHTML = html;
}

renderDayTabs();
renderTeachers();
</script>
</body>
</html>
